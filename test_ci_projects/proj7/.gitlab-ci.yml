stages:
  - test
  - integration
  - build

# Job using PostgreSQL service
test:postgres:
  stage: test
  image: ruby:3.2
  services:
    - name: postgres:15
      alias: db
  variables:
    POSTGRES_DB: test_database
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: "postgresql://test_user:test_password@db:5432/test_database"
  script:
    - apt-get update -qq && apt-get install -y postgresql-client
    - echo "Testing PostgreSQL connection..."
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h db -U test_user -d test_database -c "SELECT version();"
    - echo "Running database migrations..."
    - echo "Running tests against database..."

# Job using Redis service
test:redis:
  stage: test
  image: node:18
  services:
    - name: redis:7-alpine
      alias: cache
  variables:
    REDIS_URL: "redis://cache:6379"
  script:
    - apt-get update -qq && apt-get install -y redis-tools
    - echo "Testing Redis connection..."
    - redis-cli -h cache ping
    - redis-cli -h cache SET test_key "test_value"
    - redis-cli -h cache GET test_key
    - echo "Running cache integration tests..."

# Job using multiple services
integration:full-stack:
  stage: integration
  image: python:3.11
  services:
    - name: postgres:15
      alias: database
    - name: redis:7-alpine
      alias: redis
    - name: elasticsearch:8.11.0
      alias: search
      command: ["bin/elasticsearch", "-Expack.security.enabled=false"]
  variables:
    POSTGRES_DB: app_db
    POSTGRES_USER: app_user
    POSTGRES_PASSWORD: app_pass
    DATABASE_URL: "postgresql://app_user:app_pass@database:5432/app_db"
    REDIS_URL: "redis://redis:6379"
    ELASTICSEARCH_URL: "http://search:9200"
  script:
    - pip install psycopg2-binary redis elasticsearch
    - echo "Testing all service connections..."
    - python -c "import psycopg2; conn = psycopg2.connect('$DATABASE_URL'); print('PostgreSQL OK')"
    - python -c "import redis; r = redis.from_url('$REDIS_URL'); r.ping(); print('Redis OK')"
    - sleep 10  # Wait for Elasticsearch to be ready
    - python -c "from elasticsearch import Elasticsearch; es = Elasticsearch(['$ELASTICSEARCH_URL']); print('Elasticsearch OK')"
    - echo "Running full integration tests..."

# Docker-in-Docker job
build:docker:
  stage: build
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  script:
    - echo "Building Docker image..."
    - docker info
    - |
      cat > Dockerfile <<EOF
      FROM alpine:3.19
      RUN apk add --no-cache curl
      CMD ["echo", "Hello from Docker"]
      EOF
    - docker build -t test-app:$IMAGE_TAG .
    - docker images
    - docker run --rm test-app:$IMAGE_TAG
    - echo "Docker build completed successfully"

# MySQL service example
test:mysql:
  stage: test
  image: ruby:3.2
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: root_password
    MYSQL_DATABASE: test_db
    MYSQL_USER: test_user
    MYSQL_PASSWORD: test_pass
    DATABASE_URL: "mysql2://test_user:test_pass@mysql:3306/test_db"
  script:
    - apt-get update -qq && apt-get install -y default-mysql-client
    - echo "Waiting for MySQL to be ready..."
    - sleep 10
    - mysql -h mysql -u test_user -ptest_pass test_db -e "SELECT 'MySQL connection successful';"
    - echo "Running MySQL tests..."

# MongoDB service example
test:mongodb:
  stage: test
  image: node:18
  services:
    - name: mongo:7
      alias: mongodb
  variables:
    MONGODB_URL: "mongodb://mongodb:27017/test_db"
  script:
    - apt-get update -qq && apt-get install -y curl gnupg
    - curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | gpg --dearmor -o /usr/share/keyrings/mongodb-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/mongodb-archive-keyring.gpg] http://repo.mongodb.org/apt/debian bullseye/mongodb-org/7.0 main" | tee /etc/apt/sources.list.d/mongodb-org-7.0.list
    - apt-get update -qq && apt-get install -y mongodb-mongosh
    - echo "Testing MongoDB connection..."
    - mongosh $MONGODB_URL --eval "db.version()"
    - echo "Running MongoDB tests..."

# Service with custom entrypoint
test:custom-service:
  stage: test
  image: alpine:3.19
  services:
    - name: nginx:alpine
      alias: webserver
      entrypoint: ["nginx", "-g", "daemon off;"]
  script:
    - apk add --no-cache curl
    - sleep 5
    - echo "Testing custom service with entrypoint..."
    - curl -f http://webserver:80 || echo "Service is running"
