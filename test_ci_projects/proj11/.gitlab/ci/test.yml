# Script lines containing ': ' are single-quoted: unquoted, YAML reads them as
# mappings, which upstream rejects as script entries (TASK-38).
# Test stage jobs
.test-template:
  stage: test
  before_script:
    - echo "Setting up test environment..."

unit-tests:
  extends: .test-template
  script:
    - echo "Running unit tests..."
    - 'echo "Test suite: Unit Tests"'
    - 'echo "Tests passed: 150/150"'
    - 'echo "Coverage: 85%"'
  dependencies:
    - build-app

integration-tests:
  extends: .test-template
  script:
    - echo "Running integration tests..."
    - 'echo "Test suite: Integration Tests"'
    - 'echo "Tests passed: 45/45"'
    - echo "All integration tests passed"
  dependencies:
    - build-app
  allow_failure: false

security-scan:
  extends: .test-template
  script:
    - echo "Running security scan..."
    - echo "Scanning for vulnerabilities..."
    - echo "No critical vulnerabilities found"
  allow_failure: true
