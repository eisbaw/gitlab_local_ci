# Backend-specific CI configuration
# This file is included by the main .gitlab-ci.yml

.backend_base:
  image: ruby:3.2-alpine
  cache:
    key: "backend-gems-${CI_COMMIT_REF_SLUG}"
    paths:
      - services/backend/vendor/bundle/
  before_script:
    - cd services/backend
    - bundle config set --local path 'vendor/bundle'
    - bundle install --jobs 4

# Additional backend-specific jobs
audit:backend:dependencies:
  extends: .backend_base
  stage: security
  needs: []
  script:
    - bundle audit check --update
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'

database:migrations:check:
  extends: .backend_base
  stage: test
  needs: []
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: migration_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DATABASE_URL: "postgresql://test_user:test_pass@postgres:5432/migration_test"
    RAILS_ENV: test
  before_script:
    - !reference [.backend_base, before_script]
    - apk add --no-cache postgresql-client
    - until pg_isready -h postgres -U test_user; do sleep 1; done
  script:
    - bundle exec rake db:create
    - bundle exec rake db:migrate
    - bundle exec rake db:rollback STEP=3
    - bundle exec rake db:migrate
    - echo "Migration consistency check passed"
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - services/backend/db/migrate/**/*
