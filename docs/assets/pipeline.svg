<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">One pipeline builder for every command</title>
  <desc id="d">The .gitlab-ci.yml goes through the same steps as in GitLab: includes, extends, !reference, default and inherit, parallel and matrix, stages including .pre and .post. lint checks the result for every job. Then workflow rules and job rules select the jobs of one pipeline, which dag, dry-run, run and export-just all use.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8299"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="328" rx="18" fill="#f6f4fa" stroke="#d4cde3" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2b2240">
    <text x="30" y="40" font-size="16" font-weight="700">PipelineBuilder: the same steps as GitLab, in GitLab's order</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#2b2240" text-anchor="middle">
    <rect x="30" y="66" width="128" height="40" rx="8" fill="#ffffff" stroke="#fc6d26" stroke-width="2"/>
    <text x="94" y="91">.gitlab-ci.yml</text>
    <path d="M158,86 L178,86" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="180" y="66" width="84" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="222" y="91">include</text>
    <path d="M264,86 L284,86" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="286" y="66" width="84" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="328" y="91">extends</text>
    <path d="M370,86 L390,86" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="392" y="66" width="100" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="442" y="91">!reference</text>
    <path d="M492,86 L512,86" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="514" y="66" width="140" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="584" y="91">default/inherit</text>
    <path d="M654,86 L674,86" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="676" y="66" width="90" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="721" y="91">parallel</text>
    <path d="M766,86 L786,86" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="788" y="66" width="150" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="863" y="91">stages .pre/.post</text>

    <path d="M863,106 L863,150" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="768" y="152" width="190" height="40" rx="8" fill="#ffffff" stroke="#6e49cb" stroke-width="1.5"/>
    <text x="863" y="177">workflow + job rules</text>
    <path d="M768,172 L692,172" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>

    <path d="M863,106 C863,130 300,120 236,150" fill="none" stroke="#8a8299" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <rect x="30" y="152" width="300" height="40" rx="8" fill="#fff4ec" stroke="#fc6d26" stroke-width="2"/>
    <text x="180" y="177">lint: every job, before rules</text>

    <rect x="410" y="152" width="280" height="40" rx="8" fill="#efeaf9" stroke="#6e49cb" stroke-width="2"/>
    <text x="550" y="177">jobs of this pipeline</text>
    <path d="M550,192 L550,214" stroke="#8a8299" stroke-width="2"/>
    <path d="M190,214 L890,214" stroke="#8a8299" stroke-width="2"/>
    <path d="M190,214 L190,236" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <path d="M430,214 L430,236" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <path d="M670,214 L670,236" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <path d="M890,214 L890,236" stroke="#8a8299" stroke-width="2" marker-end="url(#a)"/>
    <rect x="110" y="238" width="160" height="40" rx="8" fill="#fff4ec" stroke="#fc6d26" stroke-width="2"/>
    <text x="190" y="263">dag</text>
    <rect x="350" y="238" width="160" height="40" rx="8" fill="#fff4ec" stroke="#fc6d26" stroke-width="2"/>
    <text x="430" y="263">dry-run</text>
    <rect x="590" y="238" width="160" height="40" rx="8" fill="#fff4ec" stroke="#fc6d26" stroke-width="2"/>
    <text x="670" y="263">run</text>
    <rect x="830" y="238" width="120" height="40" rx="8" fill="#fff4ec" stroke="#fc6d26" stroke-width="2"/>
    <text x="890" y="263">export-just</text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#5a5270">
    <text x="190" y="300" text-anchor="middle">Graphviz DOT</text>
    <text x="430" y="300" text-anchor="middle">stage/needs timeline on mock runners</text>
    <text x="670" y="300" text-anchor="middle">jobs in bash, GitLab job env</text>
    <text x="890" y="300" text-anchor="middle">justfile recipes</text>
  </g>
</svg>
